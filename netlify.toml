[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# 1. API Route Redirect to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 2. React Router SPA Fallback (Catch-all for all client-side pages)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
